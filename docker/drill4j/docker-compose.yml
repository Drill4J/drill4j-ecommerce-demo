services:

  drill-ui:
    image: ghcr.io/drill4j/drill4j-ui:${DRILL_UI_VERSION}
    environment:
      API_HOST: host.docker.internal
      API_PORT: 8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8080"

  drill-admin:
    image: ghcr.io/drill4j/admin:${DRILL_ADMIN_BACKEND_VERSION}
    environment:
      - DRILL_METRICS_UI_BASE_URL=${DRILL_METRICS_UI_BASE_URL}
      - DRILL_DB_PORT=5432
      - DRILL_AGENTS_SOCKET_TIMEOUT=6000
      - DRILL_DB_HOST=${POSTGRES_HOST}
      - DRILL_DB_NAME=${POSTGRES_DB}
      - DRILL_DB_USER_NAME=${POSTGRES_USER}
      - DRILL_DB_PASSWORD=${POSTGRES_PASSWORD}
      - DRILL_DB_MAX_POOL_SIZE=${DRILL_ADMIN_BACKEND_DB_MAX_POOL_SIZE}
      - LOG_LEVEL=info
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8090" ]
      interval: 10s
      timeout: 3s
      retries: 30
    ports:
      - 8090:8090
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.0
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - drill-data-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "log_statement=all", "-c", "log_min_duration_statement=0"]

  agent-files:
    image: drill4j/java-agent:0.8.0-38
    environment:
      # Version of agent binaries downloaded into the shared volume (not the downloader image tag).
      - AGENT_VERSION=${JAVA_AGENT_VERSION:-0.11.0}
    volumes:
      - agent-files:/data
    healthcheck:
      # Wait until Java-mode runtime jar (and native lib) are present for ecommerce consumers.
      test: ["CMD", "sh", "-c", "test -f /data/agent/drill-runtime.jar && test -f /data/agent/libdrill_agent.so || exit 1"]
      interval: 5s
      retries: 30
      start_period: 10s
      timeout: 10s

volumes:
  drill-data-pg:
  agent-files:
