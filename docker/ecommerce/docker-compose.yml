services:
  auth:
    build:
      context: ../../example_app/auth
      dockerfile: Dockerfile
    ports:
      - "${AUTH_HOST_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret-change-me-please-set-a-longer-secret}
      AUTH_JWT_TTL_SECONDS: ${AUTH_JWT_TTL_SECONDS:-86400}
      # Drill4J Java agent (Java mode). Same shared volume as backend (drill4j_agent-files).
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m -javaagent:/data/agent/drill-runtime.jar}
      DRILL_API_URL: ${DRILL_API_URL:-http://host.docker.internal:8090/api}
      DRILL_API_KEY: ${DRILL_API_KEY:-2_39d44744f60b65a7e0c4355a49938b9a2d30f48ec0e862e53cae86e356e9331b}
      DRILL_GROUP_ID: ${DRILL_GROUP_ID:-ecommerce}
      DRILL_APP_ID: auth
      DRILL_PACKAGE_PREFIXES: com/example/auth
      DRILL_BUILD_VERSION: 0.1.0
    volumes:
      - agent-files:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ../../example_app/backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://auth:8081/api/v1}
      # Drill4J Java agent (Java mode). Agent files come from the shared agent-files volume
      # populated by docker/drill4j (volume: drill4j_agent-files). Requires JAVA_AGENT_VERSION
      # set when starting docker/drill4j so drill-runtime.jar is downloaded.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m -javaagent:/data/agent/drill-runtime.jar}
      # From inside Docker, use host.docker.internal to reach Drill Admin on the host (localhost:8090).
      DRILL_API_URL: ${DRILL_API_URL:-http://host.docker.internal:8090/api}
      DRILL_API_KEY: ${DRILL_API_KEY:-2_39d44744f60b65a7e0c4355a49938b9a2d30f48ec0e862e53cae86e356e9331b}
      DRILL_GROUP_ID: ${DRILL_GROUP_ID:-ecommerce}
      DRILL_APP_ID: backend
      DRILL_PACKAGE_PREFIXES: com/example/ecommerce
      DRILL_BUILD_VERSION: 0.1.0

    volumes:
      - agent-files:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../../example_app/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Used by frontend container entrypoint to generate nginx reverse-proxy config at runtime.
      # These are upstream URLs as seen from inside the frontend container.
      API_BASE_URL: ${API_BASE_URL:-http://backend:8080/api/v1}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://auth:8081/api/v1/auth}
    restart: unless-stopped

volumes:
  agent-files:
    external: true
    name: drill4j_agent-files
