plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.epam.drill.integration.cicd' version '0.11.0'
}

group = 'com.example.ecommerce'
version = '0.1.4'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Report to Drill Admin only from a clean git work tree (committed HEAD).
// Dirty trees keep unit/api runnable locally but do not attach the CI/CD agent
// (coverage + testTracing both off → plugin skips agent injection).
// Override: DRILL_REPORT_ENABLED=true|false|1|0 (used by scripts/replay-history.sh).
ext.drillReportEnabled = {
    def force = System.getenv('DRILL_REPORT_ENABLED')
    if (force != null) {
        return force.equalsIgnoreCase('true') || force == '1'
    }
    def dir = project.projectDir
    while (dir != null) {
        if (new File(dir, '.git').exists()) {
            break
        }
        dir = dir.parentFile
    }
    if (dir == null) {
        return false
    }
    def proc = new ProcessBuilder('git', 'status', '--porcelain')
            .directory(dir)
            .redirectErrorStream(true)
            .start()
    def out = proc.inputStream.text.trim()
    def code = proc.waitFor()
    return code == 0 && out.isEmpty()
}()

tasks.named('test') {
    useJUnitPlatform()
    description = 'Runs all tests (unit + API)'
    // Prefer gradle unitTest / apiTest for Drill4J-instrumented runs.
    drill {
        coverage { enabled = false }
        testTracing { enabled = false }
    }
}

tasks.register('unitTest', Test) {
    group = 'verification'
    description = 'Runs unit tests only (@Tag("unit"))'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'unit'
    }
    shouldRunAfter tasks.named('testClasses')
    drill {
        coverage { enabled = drillReportEnabled }
        testTracing {
            enabled = drillReportEnabled
            perTestSession = true
            perTestLaunch = false
        }
    }
}

tasks.register('apiTest', Test) {
    group = 'verification'
    description = 'Runs API tests only (@Tag("api"))'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'api'
    }
    shouldRunAfter tasks.named('testClasses')
    drill {
        coverage { enabled = drillReportEnabled }
        testTracing {
            enabled = drillReportEnabled
            perTestSession = true
            perTestLaunch = true
        }
    }
}

// Thin JAR for library-style consumers (optional).
tasks.named('jar') {
    enabled = true
    archiveClassifier = 'plain'
}
tasks.named('bootJar') {
    archiveClassifier = 'boot'
}

// Same Drill Admin host/port as E2E; API key from DRILL_API_KEY (same as Playwright).
drill {
    apiUrl = System.getenv('DRILL_API_URL') ?: 'http://localhost:8090/api'
    apiKey = System.getenv('DRILL_API_KEY') ?: ''
    groupId = System.getenv('DRILL_GROUP_ID') ?: 'ecommerce'
    appId = 'backend'
    packagePrefixes = ['com/example/ecommerce']
    buildVersion = version

    agent {
        version = '0.11.0'
        agentMode = 'JAVA'
    }

    // Features enabled per unitTest / apiTest (see task-level drill {} overrides).
    coverage()
    testTracing()
}
