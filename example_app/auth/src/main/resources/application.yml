spring:
  application:
    name: example-ecommerce-auth

server:
  port: ${SERVER_PORT:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-secret-change-me-please-set-a-longer-secret}
    ttl-seconds: ${AUTH_JWT_TTL_SECONDS:86400}

